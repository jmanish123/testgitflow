<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Todo App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .todo-input {
            display: flex;
            margin-bottom: 20px;
        }
        #task-input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }
        #add-btn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        #add-btn:hover {
            background-color: #45a049;
        }
        .todo-list {
            list-style-type: none;
            padding: 0;
        }
        .todo-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .todo-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }
        .task-text {
            flex: 1;
        }
        .complete-btn, .delete-btn {
            margin-left: 10px;
            padding: 5px 10px;
            border: none;
            cursor: pointer;
        }
        .complete-btn {
            background-color: #2196F3;
            color: white;
        }
        .delete-btn {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Basic Todo App</h1>
    <div class="todo-input">
        <input type="text" id="task-input" placeholder="Enter a new task">
        <button id="add-btn">Add Task</button>
    </div>
    <ul class="todo-list" id="todo-list"></ul>

    <script>
        const taskInput = document.getElementById('task-input');
        const addBtn = document.getElementById('add-btn');
        const todoList = document.getElementById('todo-list');

        // Load todos on page load
        loadTodos();

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        async function loadTodos() {
            try {
                const response = await fetch('/api/todos');
                const todos = await response.json();
                renderTodos(todos);
            } catch (error) {
                console.error('Error loading todos:', error);
            }
        }

        async function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText === '') return;

            try {
                const response = await fetch('/api/todos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: taskText })
                });
                if (response.ok) {
                    taskInput.value = '';
                    loadTodos(); // Reload the list
                }
            } catch (error) {
                console.error('Error adding task:', error);
            }
        }

        async function toggleComplete(id) {
            try {
                const todo = document.querySelector(`[data-id="${id}"]`);
                const completed = !todo.classList.contains('completed');
                const response = await fetch(`/api/todos/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ completed })
                });
                if (response.ok) {
                    loadTodos(); // Reload the list
                }
            } catch (error) {
                console.error('Error updating task:', error);
            }
        }

        async function deleteTask(id) {
            try {
                const response = await fetch(`/api/todos/${id}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    loadTodos(); // Reload the list
                }
            } catch (error) {
                console.error('Error deleting task:', error);
            }
        }

        function renderTodos(todos) {
            todoList.innerHTML = '';
            todos.forEach(todo => {
                const li = document.createElement('li');
                li.className = 'todo-item';
                li.setAttribute('data-id', todo.id);
                if (todo.completed) {
                    li.classList.add('completed');
                }

                const span = document.createElement('span');
                span.className = 'task-text';
                span.textContent = todo.text;

                const completeBtn = document.createElement('button');
                completeBtn.className = 'complete-btn';
                completeBtn.textContent = todo.completed ? 'Undo' : 'Complete';
                completeBtn.addEventListener('click', () => toggleComplete(todo.id));

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'Delete';
                deleteBtn.addEventListener('click', () => deleteTask(todo.id));

                li.appendChild(span);
                li.appendChild(completeBtn);
                li.appendChild(deleteBtn);
                todoList.appendChild(li);
            });
        }
    </script>
</body>
</html>
